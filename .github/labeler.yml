# Auto-labeler configuration
# Automatically adds labels based on changed files

# Area: Frontend
'area: frontend':
  - changed-files:
    - any-glob-to-any-file:
      - 'web/**/*'

# Area: Backend
'area: backend':
  - changed-files:
    - any-glob-to-any-file:
      - 'server/**/*.go'
      - 'server/go.mod'
      - 'server/go.sum'

# Area: Exchange (broker adapters and market data providers)
'area: exchange':
  - changed-files:
    - any-glob-to-any-file:
      - 'server/trader/**/*'
      - 'server/provider/**/*'

# Area: AI (model clients)
'area: ai':
  - changed-files:
    - any-glob-to-any-file:
      - 'server/llm/**/*'

# Area: API
'area: api':
  - changed-files:
    - any-glob-to-any-file:
      - 'server/api/**/*'

# Area: Security
'area: security':
  - changed-files:
    - any-glob-to-any-file:
      - '**/auth*.go'
      - '**/jwt*.go'
      - 'server/secrets/**/*'
      - '**/encryption*.go'

# Area: Database
'area: database':
  - changed-files:
    - any-glob-to-any-file:
      - 'server/store/**/*'
      - '**/*.sql'

# Area: UI/UX
'area: ui/ux':
  - changed-files:
    - any-glob-to-any-file:
      - 'web/src/features/**/*'
      - 'web/src/shared/ui/**/*'
      - 'web/src/**/*.css'

# Area: Deployment
'area: deployment':
  - changed-files:
    - any-glob-to-any-file:
      - 'deploy/**/*'
      - 'Dockerfile.railway'
      - 'railway.toml'
      - 'docker-compose*.yml'
      - '.github/workflows/**/*'
      - 'start.sh'
      - 'install*.sh'

# Type: Documentation
'type: documentation':
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - '*.md'

# Type: Test
'type: test':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*_test.go'
      - '**/*.test.ts'
      - '**/*.test.tsx'

# Dependencies
'dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - 'server/go.mod'
      - 'server/go.sum'
      - 'web/package.json'
      - 'web/package-lock.json'
