<text x="462" y="434" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">lots of 100, T+1, price</text>
<text x="462" y="453" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">limits, no shorting for</text>
<text x="462" y="472" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">A-shares, exposure caps</text>
<rect x="645" y="385" width="170" height="140" rx="8" fill="#FFFBF5" stroke="#E0483B" stroke-width="1.2"/>
<text x="657" y="410" font-size="13" fill="#E0483B" font-weight="bold" text-anchor="start">4  Execute</text>
<text x="657" y="434" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">paper broker fills</text>
<text x="657" y="453" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">with fees; stop-loss</text>
<text x="657" y="472" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">and take-profit orders</text>
