<text x="267" y="453" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">LLM returns JSON</text>
<text x="267" y="472" font-size="11" fill="#1A1813" font-weight="normal" text-anchor="start">trading decisions</text>
