services:
  # Backend service (API and core logic)
  crux:
    build:
      context: .
      dockerfile: ./deploy/docker/Dockerfile.backend
    container_name: crux-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "${CRUX_BACKEND_PORT:-${NOFX_BACKEND_PORT:-8080}}:8080"
      # pprof profiling is bound to host loopback only; uncomment for local debug.
      # - "127.0.0.1:6060:6060"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - API_SERVER_PORT=8080
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-8000}
    networks:
      - crux-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  crux-frontend:
    build:
      context: .
      dockerfile: ./deploy/docker/Dockerfile.frontend
    container_name: crux-frontend
    restart: unless-stopped
    ports:
      - "${CRUX_FRONTEND_PORT:-${NOFX_FRONTEND_PORT:-3000}}:80"
    networks:
      - crux-network
    depends_on:
      - crux
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  crux-network:
    driver: bridge
